          type: string
        vehicleType:
          type: string
        totalTrips:
          type: number
        distanceCovered:
          type: number
        userId:
          type: string
        buildYear:
          type: string
        make:
          type: string
        model:
          type: string
        nickName:
          type: string
        engineSize:
          type: string
        createdAt:
          type: string
        updatedAt:
          type: string
        __v:
          type: number
        photo:
          type: string
      example:
        id: 61248002b6bd2b001613a242,
        vehicleType: car,
        totalTrips: 0,
        distanceCovered: 0,
        userId: 61110ff731fc32440f523766,
        buildYear: 2012,
        make: USA,
        model: mercedez benz,
        nickName: buggy,
        engineSize: 1500,
