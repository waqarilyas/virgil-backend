components:
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        country:
          type: string
        zipCode:
          type: string
        city:
          type: string
        isEmailVerified:
          type: boolean
        deviceId:
          type: string
        role:
          type: string
          enum: [user, admin]
        isSocial:
          type: boolean,
        platform:
          type: string,
          enum: [google, facebook, apple]
      example:
        id: 5ebac534954b54139806c112
        email: fake@example.com
        firstName: fake
        lastName: name
        role: user
        country: US
        zipCode: 54000
        isEmailVerified: false
        deviceId: asgdfhagsfd787567FGHSFH
        isSocial: false
        platform: google
    allUsers:
      type: array
      example:
        [
          {
            id: 5ebac534954b54139806c112,
            email: fake@example.com,
            firstName: fake,
            lastName: name,
            role: user,
            country: US,
            zipCode: 54000,
            isEmailVerified: false,
            deviceId: asgdfhagsfd787567FGHSFH,
            isSocial: false,
            platform: google,
          },
          {
            id: 89ba2r34954b54139806c112,
            email: fake1@example.com,
            firstName: fake1,
            lastName: name1,
            role: user,
            country: US,
            zipCode: 54000,
            isEmailVerified: false,
            deviceId: asg22dfhagsfd787567FGHSFH,
            isSocial: false,
            platform: google,
          },
        ]
    allVehicles:
      type: object
      properties:
        page:
          type: number
        totalResults:
          type: number
        vehicles:
          type: array
