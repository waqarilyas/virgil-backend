        id:
          type: string
        rideName:
          type: string
        descriptors:
          type: array
        isPublic:
          type: boolean
        coordinates:
          type: array
        riddenBy:
          type: array
        totalRating:
          type: number
        reviews:
          type: array
        routeSnap:
          type: string
        routeLength:
          type: number
        timeTaken:
          type: number
        owner:
          type: string
        vehicleId:
          type: string
        imageType:
          type: string
      example:
        id: 5ebac534954b54139806c112
        rideName: Very nice ride
        descriptors: ["amazing", "rana"]
